<!-- @dsCard group="Type" viewport="700x190" name="Body & UI text" subtitle="IBM Plex Sans — the workbench scale" -->
<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"/><link rel="stylesheet" href="../styles.css"/>
<style>
  body{margin:0;padding:22px;background:var(--color-bg);color:var(--color-text);font-family:var(--font-sans)}
  .r{display:flex;align-items:baseline;gap:14px;margin-bottom:11px}
  .m{font-family:var(--font-mono);font-size:var(--text-2xs);color:var(--color-text-faint);width:110px;flex-shrink:0}
  .cap{text-transform:uppercase;letter-spacing:var(--tracking-caps)}
</style></head>
<body>
  <div class="r"><span class="m">md · 500</span><span style="font-size:var(--text-md);font-weight:var(--weight-medium)">Portfolio — sidebar navigation</span></div>
  <div class="r"><span class="m">base · 400</span><span style="font-size:var(--text-base)">Default body — analyst answers, questions, descriptions.</span></div>
  <div class="r"><span class="m">base · 600</span><span style="font-size:var(--text-base);font-weight:var(--weight-semibold)">Bold lead sentence carrying the headline number.</span></div>
  <div class="r"><span class="m">sm · 500</span><span style="font-size:var(--text-sm);font-weight:var(--weight-medium);color:var(--color-text-2)">Secondary UI — stat labels, tab titles.</span></div>
  <div class="r"><span class="m">2xs · 600 caps</span><span class="cap" style="font-size:var(--text-2xs);font-weight:var(--weight-semibold);color:var(--color-text-muted)">Explorer · Section label</span></div>
</body></html>
