<!-- @dsCard group="Spacing" viewport="700x150" name="Spacing scale" subtitle="4px grid — roomy workbench rhythm" -->
<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"/><link rel="stylesheet" href="../styles.css"/>
<style>
  body{margin:0;padding:22px;background:var(--color-bg);color:var(--color-text);font-family:var(--font-sans);display:flex;gap:16px;align-items:flex-end}
  .c{display:flex;flex-direction:column;align-items:center;gap:6px}
  .bar{background:var(--color-accent);border-radius:2px;width:100%}
  .k{font-family:var(--font-mono);font-size:var(--text-2xs);color:var(--color-text-muted)}
</style></head>
<body>
  <div class="c" style="width:16px"><div class="bar" style="height:4px"></div><span class="k">1</span></div>
  <div class="c" style="width:16px"><div class="bar" style="height:8px"></div><span class="k">2</span></div>
  <div class="c" style="width:16px"><div class="bar" style="height:12px"></div><span class="k">3</span></div>
  <div class="c" style="width:16px"><div class="bar" style="height:16px"></div><span class="k">4</span></div>
  <div class="c" style="width:16px"><div class="bar" style="height:24px"></div><span class="k">6</span></div>
  <div class="c" style="width:16px"><div class="bar" style="height:32px"></div><span class="k">8</span></div>
  <div class="c" style="width:16px"><div class="bar" style="height:48px"></div><span class="k">12</span></div>
  <div class="c" style="width:16px"><div class="bar" style="height:64px"></div><span class="k">16</span></div>
</body></html>
