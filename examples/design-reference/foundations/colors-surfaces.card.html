<!-- @dsCard group="Colors" viewport="700x150" name="Paper neutrals" subtitle="Warm off-white surface ladder + ink text" -->
<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"/><link rel="stylesheet" href="../styles.css"/>
<style>
  body{margin:0;padding:20px;background:var(--color-bg);display:flex;gap:10px;font-family:var(--font-sans)}
  .sw{border-radius:var(--radius-lg);border:1px solid var(--color-border);padding:12px;display:flex;flex-direction:column;justify-content:flex-end;min-height:90px;flex:1;color:var(--color-text)}
  .n{font-size:var(--text-sm);font-weight:var(--weight-medium)}
  .h{font-family:var(--font-mono);font-size:var(--text-2xs);color:var(--color-text-muted)}
</style></head>
<body>
  <div class="sw" style="background:var(--color-bg)"><span class="n">Paper</span><span class="h">60 20% 99%</span></div>
  <div class="sw" style="background:var(--color-surface)"><span class="n">Surface</span><span class="h">0 0% 100%</span></div>
  <div class="sw" style="background:var(--color-panel)"><span class="n">Panel</span><span class="h">60 8% 96%</span></div>
  <div class="sw" style="background:var(--color-panel-hover)"><span class="n">Panel 2</span><span class="h">60 7% 92%</span></div>
  <div class="sw" style="background:var(--color-primary);color:#fff"><span class="n">Ink</span><span class="h" style="color:hsl(0 0% 100%/.6)">45 8% 11%</span></div>
</body></html>
