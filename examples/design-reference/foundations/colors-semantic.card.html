<!-- @dsCard group="Colors" viewport="700x150" name="Semantic status" subtitle="green · red · amber · blue — soft tint + solid text" -->
<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"/><link rel="stylesheet" href="../styles.css"/>
<style>
  body{margin:0;padding:20px;background:var(--color-bg);display:flex;gap:12px;font-family:var(--font-sans)}
  .sw{border-radius:var(--radius-lg);border:1px solid var(--color-border);padding:12px;display:flex;flex-direction:column;justify-content:flex-end;min-height:88px;flex:1}
  .n{font-size:var(--text-sm);font-weight:var(--weight-semibold)}
  .h{font-family:var(--font-mono);font-size:var(--text-2xs);opacity:.75}
</style></head>
<body>
  <div class="sw" style="background:var(--color-success-soft);color:var(--color-success)"><span class="n">Success / Up</span><span class="h">152 55% 32%</span></div>
  <div class="sw" style="background:var(--color-danger-soft);color:var(--color-danger)"><span class="n">Danger / Down</span><span class="h">3 62% 52%</span></div>
  <div class="sw" style="background:var(--color-warning-soft);color:var(--color-warning)"><span class="n">Warning</span><span class="h">38 88% 44%</span></div>
  <div class="sw" style="background:var(--color-info-soft);color:var(--color-info)"><span class="n">Info / Link</span><span class="h">217 72% 50%</span></div>
</body></html>
