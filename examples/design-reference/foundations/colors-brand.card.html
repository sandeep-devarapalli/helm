<!-- @dsCard group="Colors" viewport="700x150" name="Market green" subtitle="The brand accent — up, buy, positive" -->
<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"/><link rel="stylesheet" href="../styles.css"/>
<style>
  body{margin:0;padding:20px;background:var(--color-bg);display:flex;gap:14px;font-family:var(--font-sans)}
  .sw{border-radius:var(--radius-lg);border:1px solid var(--color-border);padding:12px;display:flex;flex-direction:column;justify-content:flex-end;min-height:88px;flex:1}
  .n{font-size:var(--text-sm);font-weight:var(--weight-semibold)}
  .h{font-family:var(--font-mono);font-size:var(--text-2xs);opacity:.75}
</style></head>
<body>
  <div class="sw" style="background:var(--color-accent);color:#fff"><span class="n">Green</span><span class="h">152 55% 32%</span></div>
  <div class="sw" style="background:var(--color-chart);color:#fff"><span class="n">Chart line</span><span class="h">152 50% 40%</span></div>
  <div class="sw" style="background:var(--color-accent-soft);color:var(--color-accent)"><span class="n">Soft tint</span><span class="h">Buy pill fill</span></div>
  <div class="sw" style="background:var(--color-surface);color:var(--color-accent);border-color:var(--color-accent-hairline)"><span class="n">Hairline</span><span class="h">Proposal border</span></div>
</body></html>
