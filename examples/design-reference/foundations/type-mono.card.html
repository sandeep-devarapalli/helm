<!-- @dsCard group="Type" viewport="700x170" name="Mono & numerals" subtitle="IBM Plex Mono — wordmark, prices, tickers, all figures" -->
<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"/><link rel="stylesheet" href="../styles.css"/>
<style>
  body{margin:0;padding:22px;background:var(--color-bg);color:var(--color-text);font-family:var(--font-mono);font-variant-numeric:tabular-nums}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px 12px;align-items:end}
  .k{font-family:var(--font-sans);font-size:var(--text-xs);color:var(--color-text-muted);margin-bottom:4px}
  .v{font-size:var(--text-lg);font-weight:500}
</style></head>
<body>
  <div class="grid">
    <div><div class="k">Wordmark</div><div class="v" style="font-weight:600">helm</div></div>
    <div><div class="k">Price</div><div class="v">$305.24</div></div>
    <div><div class="k">Change</div><div class="v" style="color:var(--color-up)">+43.63%</div></div>
    <div><div class="k">Ticker</div><div class="v">AAPL · NASDAQ</div></div>
    <div><div class="k">Range</div><div class="v" style="font-size:var(--text-base)">$293.68 – $306.64</div></div>
    <div><div class="k">EPS (TTM)</div><div class="v" style="font-size:var(--text-base)">$8.33</div></div>
    <div><div class="k">Account</div><div class="v" style="font-size:var(--text-base)">hi@helm.trade</div></div>
    <div><div class="k">Timestamp</div><div class="v" style="font-size:var(--text-base)">09:24:07</div></div>
  </div>
</body></html>
