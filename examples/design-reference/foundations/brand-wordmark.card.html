<!-- @dsCard group="Brand" viewport="700x180" name="Wordmark" subtitle="helm — lowercase mono, ink on paper" -->
<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"/><link rel="stylesheet" href="../styles.css"/>
<style>
  body{margin:0;padding:0;background:var(--color-bg);font-family:var(--font-mono);display:flex;height:180px}
  .panel{flex:1;display:flex;align-items:center;justify-content:center;gap:12px}
  .dark{background:hsl(45 8% 11%)}
  .wm{font-size:30px;font-weight:600;letter-spacing:-0.02em}
</style></head>
<body>
  <div class="panel">
    <span class="wm" style="color:var(--color-text)">helm</span>
  </div>
  <div class="panel" style="border-left:1px solid var(--color-border)">
    <span class="wm" style="color:var(--color-accent)">helm</span>
  </div>
  <div class="panel dark">
    <span class="wm" style="color:hsl(60 20% 99%)">helm</span>
  </div>
</body></html>
