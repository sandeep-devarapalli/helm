<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { margin: 0; padding: 22px; background: var(--color-bg); }
  .tabstrip { display: flex; align-items: stretch; background: var(--color-panel); border: 1px solid var(--color-border); border-radius: var(--radius-md) var(--radius-md) 0 0; overflow: hidden; border-bottom: 1px solid var(--color-border); margin-bottom: 18px; }
  .explorer { width: 240px; border: 1px solid var(--color-border); border-radius: var(--radius-lg); background: var(--color-bg); padding: 8px 0; }
  .exlbl { font: var(--weight-semibold) var(--text-2xs)/1 var(--font-sans); letter-spacing: var(--tracking-caps); text-transform: uppercase; color: var(--color-text-muted); padding: 6px 14px 8px; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
  const { Tab, WatchlistRow } = window.EmberDesignSystem_fc1096;
  const Bank = <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 21h18M4 18h16M6 18V9M10 18V9M14 18V9M18 18V9M12 3 2 9h20L12 3z"/></svg>;
  const Msg = <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg>;
  function Demo() {
    const [sel, setSel] = React.useState("AAPL");
    return (
      <>
        <div className="tabstrip">
          <Tab label="AAPL" icon={Bank} active onClose={()=>{}} />
          <Tab label="NVDA vs AMD m…" icon={Msg} onClose={()=>{}} />
          <Tab label="AAPL thesis" icon={Msg} />
        </div>
        <div className="explorer">
          <div className="exlbl">Explorer · Watchlist</div>
          {["AAPL","NVDA","TSLA","MSFT","GOOGL"].map(s =>
            <WatchlistRow key={s} symbol={s} selected={sel===s} onClick={()=>setSel(s)} change={s==="NVDA"?"+2.4%":undefined} />
          )}
        </div>
      </>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<Demo/>);
</script>
</body>
</html>
