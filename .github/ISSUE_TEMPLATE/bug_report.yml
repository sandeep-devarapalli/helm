name: Bug report
description: Report a reproducible problem in the helm platform or reference screens.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not report security vulnerabilities here. Follow `SECURITY.md` instead.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Select ...
        3. Observe ...
    validations:
      required: true
  - type: input
    id: path
    attributes:
      label: Affected path or component
      placeholder: apps/web, services/api, runtime/hermes-profile, packages/ui
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Runtime, browser, and OS
      placeholder: Docker 29, Safari 20, macOS 27
  - type: textarea
    id: evidence
    attributes:
      label: Additional evidence
      description: Add screenshots, console output, or a minimal reproduction. Remove private information first.
